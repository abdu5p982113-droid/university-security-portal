{% extends "base.html" %}

{% block title %}Welcome - Manonmaniam Sundaranar University{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card card-istinye text-center p-5 mt-4">
            <div class="card-body">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="University Logo"
                     style="height: 120px; margin-bottom: 30px;">

                <h1 class="mt-4 mb-3" style="color: var(--istinye-dark-blue);">
                    Manonmaniam Sundaranar University
                </h1>
                <p class="lead text-muted mb-5">
                    A secure platform for managing academic records
                </p>

                <div class="mt-5">
                    <a href="{{ url_for('login') }}" class="btn btn-istinye btn-lg me-2 px-4">Login</a>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-secondary btn-lg px-4">Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
