{% extends "base.html" %}

{% block title %}Register - Manonmaniam Sundaranar University{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-istinye mt-4">
            <div class="card-header text-center py-3">
                Create Student Account
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('register') }}">

                    <h6 class="text-muted mb-3">Account Information</h6>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required minlength="3">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required minlength="6">
                            <small class="text-muted">Minimum 6 characters</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h6 class="text-muted mb-3">Personal Information</h6>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">National ID</label>
                            <input type="text" name="national_id" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3 mt-3">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">-- Select Department --</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Information Systems">Information Systems</option>
                            <option value="Business Administration">Business Administration</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-istinye w-100 py-2 mt-3">Create Account</button>
                </form>

                <hr class="my-4">

                <p class="text-center text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}" style="color: var(--istinye-turquoise); font-weight: 500;">
                        Login here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
